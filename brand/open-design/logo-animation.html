<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiftWorks — Animación de identidad</title>
<link rel="stylesheet" href="styles.css">
<style>
:root{--motion-duration:4.2s;--motion-ease:cubic-bezier(.22,.72,.18,1)}
body.motion-page{background:var(--rw-deep-navy);color:var(--rw-cloud-white);min-height:100vh}
.motion-shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:28px clamp(18px,4vw,64px)}
.motion-top,.motion-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px}.motion-top{border-bottom:1px solid color-mix(in srgb,var(--rw-cloud-white) 18%,transparent);padding-bottom:18px}.motion-top a{color:var(--rw-cloud-white);text-decoration:none}.motion-meta{color:color-mix(in srgb,var(--rw-cloud-white) 65%,transparent);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.motion-main{display:grid;place-items:center;padding:clamp(28px,7vh,90px) 0}.motion-stage{position:relative;width:min(1120px,100%);aspect-ratio:16/7;min-height:330px;display:grid;place-items:center;overflow:hidden;border:1px solid color-mix(in srgb,var(--rw-cloud-white) 16%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--rw-deep-navy) 96%,white),var(--rw-deep-navy))}.motion-stage:before{content:"";position:absolute;inset:12%;border:1px solid color-mix(in srgb,var(--rw-cloud-white) 10%,transparent);opacity:.7}.motion-stage:after{content:"";position:absolute;left:14%;right:14%;top:50%;height:1px;background:color-mix(in srgb,var(--rw-cloud-white) 12%,transparent)}.wordmark-source{grid-area:1/1;position:relative;z-index:2}.wordmark-source{width:min(560px,78vw);height:auto;overflow:visible;color:var(--rw-cloud-white)}.wordmark-source text{font:700 82px var(--font-display);letter-spacing:-5px;fill:currentColor}.wordmark-source .morph-path{opacity:0;fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.wordmark-source .morph-left{stroke:var(--rw-signal-blue)}.wordmark-source .morph-right{stroke:var(--rw-coast-teal)}.wordmark-source .morph-bridge{opacity:0;stroke:var(--rw-cloud-white);stroke-width:8;stroke-linecap:round}.piece-r,.piece-left,.piece-w,.piece-right{transform-box:fill-box;transform-origin:center}.piece-r,.piece-left,.piece-right{fill:var(--rw-cloud-white)}.piece-w{color:var(--rw-signal-blue);fill:var(--rw-signal-blue)}.wordmark-source .morph-path{stroke-dasharray:none;stroke-dashoffset:0}.wordmark-source .morph-left{stroke:var(--rw-signal-blue)}.wordmark-source .morph-right{stroke:var(--rw-coast-teal)}.wordmark-source .morph-bridge{stroke:var(--rw-cloud-white)}.motion-stage.is-playing .wordmark-source text{animation:source-fade var(--motion-duration) var(--motion-ease) both}.motion-stage.is-playing .piece-r{animation:piece-r var(--motion-duration) var(--motion-ease) both}.motion-stage.is-playing .piece-left{animation:piece-left var(--motion-duration) var(--motion-ease) both}.motion-stage.is-playing .piece-w{animation:piece-w var(--motion-duration) var(--motion-ease) both}.motion-stage.is-playing .piece-right{animation:piece-right var(--motion-duration) var(--motion-ease) both}.motion-stage.is-playing .wordmark-source .morph-path{animation:morph-reveal var(--motion-duration) var(--motion-ease) both}.motion-stage.is-playing .wordmark-source .morph-bridge{animation:bridge-reveal var(--motion-duration) var(--motion-ease) both}.motion-copy{position:absolute;z-index:3;left:24px;bottom:20px;color:color-mix(in srgb,var(--rw-cloud-white) 62%,transparent);font:12px var(--font-mono);letter-spacing:.04em}.motion-copy strong{display:block;color:var(--rw-cloud-white);font:600 14px var(--font-display);letter-spacing:0;margin-bottom:4px}.motion-bottom{padding-top:18px}.motion-bottom p{margin:0;max-width:620px;color:color-mix(in srgb,var(--rw-cloud-white) 68%,transparent);font-size:13px;line-height:1.5}.motion-button{appearance:none;border:1px solid color-mix(in srgb,var(--rw-cloud-white) 35%,transparent);background:transparent;color:var(--rw-cloud-white);padding:11px 16px;border-radius:4px;font:600 13px var(--font-body);cursor:pointer}.motion-button:hover{border-color:var(--rw-signal-blue);color:var(--rw-signal-blue)}.motion-button:focus-visible{outline:2px solid var(--rw-signal-blue);outline-offset:3px}
@keyframes source-fade{0%,16%{opacity:1}40%{opacity:1}68%,100%{opacity:0}}
@keyframes piece-r{0%,26%{transform:translate(0,0) scale(1)}44%{transform:translate(-18px,-8px) scale(1.08)}64%,100%{transform:translate(24px,-20px) scale(.18) rotate(-12deg);opacity:0}}@keyframes piece-left{0%,26%{transform:translateX(0) scale(1)}44%{transform:translateX(-70px) scale(.92)}64%,100%{transform:translateX(76px) translateY(-35px) scale(.28) rotate(-8deg);opacity:0}}
@keyframes piece-right{0%,26%{transform:translateX(0) scale(1)}44%{transform:translateX(70px) scale(.92)}64%,100%{transform:translateX(-76px) translateY(35px) scale(.28) rotate(8deg);opacity:0}}
@keyframes piece-w{0%,26%{transform:scale(1);opacity:1}44%{transform:translate(18px,8px) scale(1.08)}64%,100%{transform:translate(-24px,20px) scale(.18) rotate(12deg);opacity:0}}
@keyframes morph-reveal{0%,24%{opacity:0}46%{opacity:.72}70%,100%{opacity:1}}@keyframes bridge-reveal{0%,68%{opacity:0}88%,100%{opacity:1}}
@media(max-width:640px){.motion-shell{padding:18px}.motion-stage{aspect-ratio:4/5;min-height:430px}.motion-copy{left:16px;bottom:16px}.motion-bottom{align-items:flex-start;flex-direction:column}.motion-button{width:100%}.motion-meta{font-size:9px}.wordmark-source text{font-size:44px;letter-spacing:-3px}.wordmark-source .morph-path{stroke-width:7}}
@media(prefers-reduced-motion:reduce){.motion-stage.is-playing .wordmark-source text,.motion-stage.is-playing .piece-r,.motion-stage.is-playing .piece-left,.motion-stage.is-playing .piece-w,.motion-stage.is-playing .piece-right,.motion-stage.is-playing .wordmark-source .morph-path{animation:none}.motion-stage.is-playing .wordmark-source text{opacity:0}.motion-stage.is-playing .wordmark-source .morph-path{opacity:1}.motion-stage.is-playing .wordmark-source .morph-bridge{opacity:1}}
</style>
</head>
<body class="motion-page">
<div class="motion-shell">
<header class="motion-top"><a class="brand" href="logo-review.html">RiftWorks</a><span class="motion-meta mono">Motion identity · Wordmark-led · 05 Señal de retorno</span><a class="motion-meta" href="wordmark-led-es.html">Volver a la exploración</a></header>
<main class="motion-main">
<section class="motion-stage" id="logo-motion" aria-label="Animación del wordmark RiftWorks hacia la firma de unión">
<svg class="wordmark-source" viewBox="0 0 420 120" role="img" aria-label="RiftWorks que se transforma en Señal de retorno">
  <text class="piece-r" x="92" y="78" text-anchor="middle">R</text>
  <text class="piece-left" x="145" y="78" text-anchor="middle">ift</text>
  <text class="piece-w" x="210" y="78" text-anchor="middle">W</text>
  <text class="piece-right" x="280" y="78" text-anchor="middle">orks</text>
  <path class="morph-path morph-left" data-from="M62 92C62 72 62 46 62 26C78 20 94 28 94 44C94 58 78 64 62 60C78 60 90 76 106 92C106 92 106 92 106 92" data-to="M62 68C98 30 130 28 154 52C178 76 218 76 258 34C258 34 258 34 258 34C258 34 258 34 258 34C258 34 258 34 258 34" d="M62 92C62 72 62 46 62 26C78 20 94 28 94 44C94 58 78 64 62 60C78 60 90 76 106 92C106 92 106 92 106 92"/>
  <path class="morph-path morph-right" data-from="M252 26C250 46 246 70 242 92C234 76 228 60 224 44C220 60 214 76 206 92C202 70 198 46 196 26C196 26 196 26 196 26C196 26 196 26 196 26" data-to="M358 68C322 30 290 28 266 52C242 76 218 76 214 50C214 50 214 50 214 50C214 50 214 50 214 50C214 50 214 50 214 50C214 50 214 50 214 50" d="M252 26C250 46 246 70 242 92C234 76 228 60 224 44C220 60 214 76 206 92C202 70 198 46 196 26C196 26 196 26 196 26C196 26 196 26 196 26"/>
  <path class="morph-bridge" d="M222 60h16"/>
</svg>

<div class="motion-copy" id="motion-copy"><strong>Del nombre a la firma</strong><span>Señal de retorno → firma abstracta</span></div>
</section>
</main>
<footer class="motion-bottom"><p>La R y la W no desaparecen para dar paso a un icono: se separan, se estiran y se convierten visualmente en las dos ondas de Señal de retorno.</p><button class="motion-button" id="play-logo" type="button">Reproducir animación</button></footer>
</div>
<script>const stage=document.querySelector('#logo-motion');const button=document.querySelector('#play-logo');const copy=document.querySelector('#motion-copy');const morphPaths=[...document.querySelectorAll('.wordmark-source [data-from]')];let timer,morphFrame;function interpolatePath(from,to,t){const a=from.match(/-?\d*\.?\d+/g).map(Number),b=to.match(/-?\d*\.?\d+/g).map(Number);let i=0;return from.replace(/-?\d*\.?\d+/g,()=>{const value=a[i]+(b[i]-a[i])*t;i++;return value.toFixed(2).replace(/\.00$/,'')})}function resetMorph(){cancelAnimationFrame(morphFrame);morphPaths.forEach(path=>path.setAttribute('d',path.dataset.from))}function morphLogo(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){morphPaths.forEach(path=>path.setAttribute('d',path.dataset.to));document.querySelector('.morph-bridge').style.opacity='1';return}const start=performance.now();function tick(now){const raw=Math.min((now-start)/3400,1),t=raw*raw*(3-2*raw);morphPaths.forEach(path=>path.setAttribute('d',interpolatePath(path.dataset.from,path.dataset.to,t)));if(raw<1)morphFrame=requestAnimationFrame(tick)}morphFrame=requestAnimationFrame(tick)}function playLogo(){clearTimeout(timer);stage.classList.remove('is-playing');resetMorph();button.disabled=true;button.textContent='Reproduciendo…';requestAnimationFrame(()=>{stage.classList.add('is-playing');morphLogo();timer=setTimeout(()=>{button.disabled=false;button.textContent='Reproducir de nuevo'},4300)})}button.addEventListener('click',playLogo);window.addEventListener('load',()=>setTimeout(playLogo,1400));</script>
</body>
</html>
