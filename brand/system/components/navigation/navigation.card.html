<!-- @dsCard group="Components" viewport="700x290" name="Navigation" subtitle="Tabs, breadcrumb, pagination, accordion" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--rw-surface)}
 .rw-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
 .rw-grid{display:grid;gap:18px}
 .rw-cap{font:var(--rw-weight-medium) var(--rw-ui-label-size)/1 var(--rw-font-mono);letter-spacing:var(--rw-ui-label-track);text-transform:uppercase;color:var(--rw-text-secondary)}
</style>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// Resolve the design-system namespace at runtime rather than hard-coding it:
// the compiler assigns the global, and it may not be "RiftWorks".
function dsScope(required) {
  const direct = window.RiftWorks;
  if (direct && required.every(n => direct[n])) return direct;
  for (const key of Object.keys(window)) {
    const v = window[key];
    if (v && typeof v === 'object' && required.every(n => typeof v[n] === 'function')) return v;
  }
  document.getElementById('root').innerHTML =
    '<pre style="font:12px/1.6 var(--rw-font-mono);color:var(--rw-oxide-deep);white-space:pre-wrap">' +
    'Design-system bundle not loaded, or it does not export: ' + required.join(', ') +
    '\nThis card renders once _ds_bundle.js is compiled.</pre>';
  return null;
}

const __ds = dsScope(['Tabs', 'Breadcrumb', 'Pagination', 'Accordion']);
const { Tabs, Breadcrumb, Pagination, Accordion } = __ds || {};
if (__ds) {
function Demo() {
  const [tab, setTab] = React.useState('Alcance');
  const [page, setPage] = React.useState(1);
  return (
    <div className="rw-grid" style={{ gridTemplateColumns:'repeat(2,1fr)', alignItems:'start', gap:26 }}>
      <div style={{ display:'flex', flexDirection:'column', gap:22 }}>
        <Tabs items={['Alcance','Fases','Equipo']} value={tab} onChange={setTab}>
          <p style={{ margin:0, font:'var(--rw-weight-regular) 13px/1.6 var(--rw-font-sans)', color:'var(--rw-text-secondary)' }}>
            Panel activo: {tab}.
          </p>
        </Tabs>
        <div style={{ borderTop:'1px solid var(--rw-border-inner)', paddingTop:16, display:'flex', flexDirection:'column', gap:16 }}>
          <Breadcrumb items={[{ label:'Proyectos', href:'#' }, { label:'2026', href:'#' }, 'RW-014']} />
          <Pagination page={page} pages={4} onChange={setPage} />
        </div>
      </div>
      <Accordion items={[
        { question:'¿Qué incluye Discover?', answer:'Dos semanas de diagnóstico, entrevistas y un mapa del estado actual.' },
        { question:'¿Cómo se factura?', answer:'Por fase, contra entregable.' },
        { question:'¿Trabajan en inglés?', answer:'Sí. Toda la documentación existe en ambos idiomas.' }
      ]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
}
</script>
</body></html>
